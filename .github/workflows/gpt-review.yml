name: GPT PR review

on:
  issue_comment:
    types: [created]

# Everything the job writes -- the review comment, the eyes reaction
# -- is on a pull request, and GITHUB_TOKEN needs pull-requests:
# write for that even through the issues endpoints; issues: write
# alone is refused with 403 once the paid call has been made.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/gpt review') &&
      github.event.comment.user.login == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The secret lives in this environment, whose deployment branches
    # are restricted to the default branch: a job can read it only
    # when it runs from there, which is this workflow and no other.
    environment: gpt-review
    # A second /gpt review on the same PR supersedes the one running.
    # Job-level on purpose: at workflow level every comment on the
    # PR -- a bot's, a reply -- would enter the group and cancel a
    # review under way before the job's if skipped it.
    concurrency:
      group: gpt-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-sol' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REVIEW_REASONING || 'xhigh' }}

    steps:
      # issue_comment runs at the default branch. Keep it that way: the
      # workflow has a secret and must never execute code from the PR.
      - name: Check out trusted reviewer
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review PR
        run: bash .github/gpt-review/review.sh
